name: Verify CollabHub
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    env:
      MONGODB_URI: mongodb://127.0.0.1:27017/collabhub_e2e?replicaSet=rs0&directConnection=true
      JWT_SECRET: ci-only-secret-with-more-than-thirty-two-characters
      CLIENT_ORIGIN: http://localhost:5173
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Start transactional MongoDB
        run: bash scripts/start-ci-mongo.sh
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run seed
      - name: Browser smoke tests
        run: E2E_START_SERVER=dev npm run test:e2e -- --reporter=list,github
      - name: Browser tests through the Vercel function
        run: E2E_START_SERVER=vercel E2E_BASE_URL=http://localhost:3004 npm run test:e2e -- --reporter=list,github
      - name: Collect failure diagnostics
        if: failure()
        run: |
          mkdir -p ci-diagnostics
          docker inspect --format '{{json .State}}' collabhub-ci-mongo > ci-diagnostics/mongo-state.json 2>&1 || true
          docker logs --tail 200 collabhub-ci-mongo > ci-diagnostics/mongo.log 2>&1 || true
          for log in /tmp/collabhub-dev.log /tmp/collabhub-vercel.log; do
            if [ -f "$log" ]; then cp "$log" ci-diagnostics/; fi
          done
          python3 - <<'PY'
          from pathlib import Path
          for name in ["/tmp/collabhub-dev.log", "/tmp/collabhub-vercel.log"]:
              path = Path(name)
              if path.exists():
                  text = path.read_text(errors="replace")[-8000:]
                  text = text.replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")
                  print(f"::error title=Test server log ({path.name})::{text}")
          PY
      - uses: actions/upload-artifact@v6
        if: failure()
        with:
          name: ci-failure-diagnostics
          path: |
            test-results/
            ci-diagnostics/
