name: Verify CollabHub
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      MONGODB_URI: mongodb://127.0.0.1:27017/collabhub_e2e?replicaSet=rs0&directConnection=true
      JWT_SECRET: ci-only-secret-with-more-than-thirty-two-characters
      CLIENT_ORIGIN: http://localhost:5173
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Start transactional MongoDB
        run: bash scripts/start-ci-mongo.sh
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run seed
      - name: Browser smoke tests
        run: |
          npm run dev > /tmp/collabhub-dev.log 2>&1 &
          for attempt in $(seq 1 30); do
            if curl -fsS http://localhost:5173/ > /dev/null && curl -fsS http://localhost:3001/api/health > /dev/null; then break; fi
            sleep 1
          done
          npm run test:e2e
      - name: Browser tests through the Vercel function
        run: |
          PORT=3004 CLIENT_ORIGIN=http://localhost:3004 npm run dev:vercel > /tmp/collabhub-vercel.log 2>&1 &
          for attempt in $(seq 1 30); do
            if curl -fsS http://localhost:3004/api/health > /dev/null; then break; fi
            sleep 1
          done
          E2E_BASE_URL=http://localhost:3004 npm run test:e2e
      - name: Collect failure diagnostics
        if: failure()
        run: |
          mkdir -p ci-diagnostics
          docker inspect --format '{{json .State}}' collabhub-ci-mongo > ci-diagnostics/mongo-state.json 2>&1 || true
          docker logs --tail 200 collabhub-ci-mongo > ci-diagnostics/mongo.log 2>&1 || true
          for log in /tmp/collabhub-dev.log /tmp/collabhub-vercel.log; do
            if [ -f "$log" ]; then cp "$log" ci-diagnostics/; fi
          done
      - uses: actions/upload-artifact@v6
        if: failure()
        with:
          name: ci-failure-diagnostics
          path: |
            test-results/
            ci-diagnostics/
