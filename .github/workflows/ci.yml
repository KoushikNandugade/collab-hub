name: Verify CollabHub
on: [push, pull_request]
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      MONGODB_URI: mongodb://127.0.0.1:27017/collabhub_e2e?replicaSet=rs0&directConnection=true
      JWT_SECRET: ci-only-secret-with-more-than-thirty-two-characters
      CLIENT_ORIGIN: http://localhost:5173
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Start transactional MongoDB
        run: |
          docker run -d --name mongo -p 127.0.0.1:27017:27017 mongo:8.0 --replSet rs0 --bind_ip_all
          for attempt in $(seq 1 30); do
            if docker exec mongo mongosh --quiet --eval 'db.adminCommand("ping").ok'; then break; fi
            sleep 1
          done
          docker exec mongo mongosh --quiet --eval 'rs.initiate({_id:"rs0",members:[{_id:0,host:"127.0.0.1:27017"}]})'
          for attempt in $(seq 1 30); do
            if docker exec mongo mongosh --quiet --eval 'if (!db.hello().isWritablePrimary) quit(1)'; then exit 0; fi
            sleep 1
          done
          exit 1
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run seed
      - name: Browser smoke tests
        run: |
          npm run dev > /tmp/collabhub-dev.log 2>&1 &
          for attempt in $(seq 1 30); do
            if curl -fsS http://localhost:5173/ > /dev/null && curl -fsS http://localhost:3001/api/health > /dev/null; then break; fi
            sleep 1
          done
          npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-test-results
          path: test-results/
