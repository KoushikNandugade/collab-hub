name: Verify live workflows
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/check-live-workflows.mjs
      - .github/workflows/live-acceptance.yml
permissions:
  contents: read
concurrency:
  group: live-collabhub-acceptance
  cancel-in-progress: false
jobs:
  live-workflows:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci --include=dev --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - name: Verify deployed workflows using labeled test accounts
        env:
          LIVE_ACCEPTANCE_ALLOW_WRITES: "1"
          LIVE_ACCEPTANCE_REPORT_PATH: /tmp/collabhub-live-workflow-report.json
        run: node scripts/check-live-workflows.mjs
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: live-workflow-report
          path: /tmp/collabhub-live-workflow-report.json
