name: Verify live workflows
on:
  workflow_dispatch:
  workflow_run:
    workflows: [Verify CollabHub]
    types: [completed]
    branches: [main]
permissions:
  contents: read
concurrency:
  group: live-collabhub-acceptance
  cancel-in-progress: false
jobs:
  live-workflows:
    if: github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 2
      - name: Select application changes for live verification
        id: scope
        env:
          MANUAL_RUN: ${{ github.event_name == 'workflow_dispatch' }}
        run: |
          git diff-tree --no-commit-id --name-only -r HEAD > /tmp/collabhub-live-changes.txt
          python3 - <<'PY_SCOPE'
          import os
          import re
          from pathlib import Path
          changed = Path("/tmp/collabhub-live-changes.txt").read_text().splitlines()
          pattern = re.compile(r"^(api/|client/|server/(src/|package\.json$)|package(-lock)?\.json$|vercel\.json$|scripts/check-live-workflows\.mjs$|\.github/workflows/live-acceptance\.yml$)")
          selected = os.environ["MANUAL_RUN"] == "true" or any(pattern.search(path) for path in changed)
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              output.write("verify=" + str(selected).lower() + "\n")
          print("Run live verification:", selected)
          if not selected:
              with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as summary:
                  summary.write("Live checks skipped: documentation or local tooling changes only.\n")
          PY_SCOPE
      - uses: actions/setup-node@v6
        if: steps.scope.outputs.verify == 'true'
        with:
          node-version: 22
          cache: npm
      - run: npm ci --include=dev --no-audit --no-fund
        if: steps.scope.outputs.verify == 'true'
      - run: npx playwright install --with-deps chromium
        if: steps.scope.outputs.verify == 'true'
      - name: Verify deployed workflows using labeled test accounts
        if: steps.scope.outputs.verify == 'true'
        env:
          LIVE_ACCEPTANCE_ALLOW_WRITES: "1"
          LIVE_ACCEPTANCE_REPORT_PATH: /tmp/collabhub-live-workflow-report.json
        run: node scripts/check-live-workflows.mjs
      - uses: actions/upload-artifact@v6
        if: always() && steps.scope.outputs.verify == 'true'
        with:
          name: live-workflow-report
          path: /tmp/collabhub-live-workflow-report.json
