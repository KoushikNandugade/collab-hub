name: Bug report
description: Report a reproducible problem in CollabHub.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: "Do not include passwords, connection strings, tokens, or private user data. Follow SECURITY.md for vulnerabilities."
  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: Describe the problem and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: Provide the smallest repeatable sequence.
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: Browser, operating system, local or hosted app, and commit if known.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Redacted logs or screenshots
      description: Include relevant error codes and remove secret values and personal data.
