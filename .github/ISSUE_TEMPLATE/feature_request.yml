name: Feature request
description: Propose an improvement to CollabHub.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
      description: Explain who encounters it and in which situation.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: Describe the experience and how you would know it works.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives or additional context
